name: Feature request
description: Propose a reusable improvement to Browser Testbench.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What testing or debugging problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired project-independent behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: platforms
    attributes:
      label: Relevant platforms
      options:
        - label: macOS
        - label: Windows
        - label: Linux
        - label: Platform-independent
