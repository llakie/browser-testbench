name: Bug report
description: Report reproducible behavior that does not work as documented.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Browser Testbench. Do not report security vulnerabilities here; use private vulnerability reporting instead.
  - type: input
    id: version
    attributes:
      label: Browser Testbench version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      description: Browser or generated target ID, if applicable.
      placeholder: chrome-android-pixel-9-api-35
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest test or command that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and other sensitive data from logs.
          required: true
